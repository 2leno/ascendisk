server:
  port: ${SERVER_PORT:2041}

aws:
  region: eu-west-3
  s3:
    bucket: ascendisk-bucket
    endpoint: ""
  sqs:
    endpoint: ""
    queue:
      url: ""
  eventBridge:
    bus: default
    endpoint: ""

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:2042,http://127.0.0.1:2042,https://ascendisk.pages.dev}
  license:
    keys: "${APP_LICENSE_KEYS:}"
  security:
    jwt:
      secret: "ascendisk-secret-ascendisk-secret-ascendisk-secret"
      expiration-minutes: 60
  market:
    yahoo:
      base-url: "https://query1.finance.yahoo.com"
      candle-limit: 120
